# yaml-language-server: $schema=https://bavix.github.io/gripmock/schema/stub.json

# Regressive delay - each matching call is faster than the previous one
- service: helloworld.Greeter
  method: SayHello
  priority: 100
  input:
    equals:
      name: regressive-delay
  output:
    delay: 30ms
    delay_type: regressive
    delay_step: 10ms
    data:
      message: Hello with regressive delay!

# Unary - Dynamic greeting using request data
- service: helloworld.Greeter
  method: SayHello
  input:
    matches:
      name: ".+"
  output:
    data:
      message: "Hello, {{.Request.name}}!"

- service: helloworld.Greeter
  method: SayHello
  headers:
    equals:
      x-user: "Ivan"
      x-token: "123"
  input:
    equals:
      name: "Alex"
  output:
    data:
      message: "Hello, {{index .Headers \"x-user\"}}!"
